name: Verify Excel tools and templates

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python code
        run: python -m compileall -q scripts tests
      - name: Test Excel toolkit
        run: python -m unittest discover -s tests -v
      - name: Parse PowerShell desktop automation
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path desktop/ExcelSkills.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            foreach ($issue in $errors) { Write-Error $issue.Message }
            exit 1
          }
      - name: Audit committed templates
        shell: bash
        run: |
          shopt -s nullglob
          files=(templates/*.xlsx)
          if (("${#files[@]}" > 0)); then
            python scripts/audit_xlsx.py --excel-2010-strict "${files[@]}"
          else
            echo "No XLSX templates committed yet."
          fi
